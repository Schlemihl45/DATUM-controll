[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnc-controller"
version = "0.1.0"
description = "Custom LinuxCNC Control Software"
requires-python = ">=3.11"

dependencies = [
    "pyside6>=6.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",      # Qt-Widget Tests headless
    "ruff>=0.6.0",            # Linter + Formatter
    "mypy>=1.11.0",           # Statische Typprüfung
    "pre-commit>=3.8.0",
]

[project.scripts]
datum-control = "controller.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
controller = ["ui/resources/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # Standard + Import-Sortierung

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true   # linuxcnc hat keine Stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
