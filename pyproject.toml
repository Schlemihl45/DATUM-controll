# ── Build system ──────────────────────────────────────────────────────────────
# scikit-build-core handles both the CMake C++ extension (voxel_mod) and the
# Python src-layout package in one pip install -e . step.
# nanobind must be in the build requirements so CMake can locate it via
# find_package(nanobind CONFIG REQUIRED).
[build-system]
requires = [
    "scikit-build-core>=0.9",
    "nanobind>=2.0",
]
build-backend = "scikit_build_core.build"

# ── Project metadata ──────────────────────────────────────────────────────────
[project]
name = "cnc-controller"
version = "0.1.0"
description = "Custom LinuxCNC Control Software"
requires-python = ">=3.11"

dependencies = [
    "pyside6>=6.7.0",
    # 3D G-code viewport — optional at runtime (graceful fallback to SimPlaceholder)
    "moderngl>=5.10.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",      # Qt-Widget Tests headless
    "ruff>=0.6.0",            # Linter + Formatter
    "mypy>=1.11.0",           # Statische Typprüfung
    "pre-commit>=3.8.0",
]
voxel = [
    # Install these before pip install -e .[voxel] to enable the C++ extension.
    # OpenVDB itself is a system library (vcpkg / brew / apt) not a pip package.
    "nanobind>=2.0",
]

[project.scripts]
datum-control = "controller.main:main"

# ── scikit-build-core ─────────────────────────────────────────────────────────
[tool.scikit-build]
# Python source package: src/ layout
wheel.packages = ["src/controller"]

# Build type for the C++ extension
cmake.build-type = "Release"

# If OpenVDB is not installed, cmake prints a warning but still succeeds
# (the root CMakeLists.txt only adds the extension when OpenVDB is found).
# cmake.optional = true would skip the cmake step entirely on failure —
# we intentionally do NOT set that so the warning is always visible.

# Editable installs: rebuild the extension on every pip install -e .
# Set to "redirect" (default) for fast rebuilds without reinstalling.
editable.mode = "redirect"
editable.rebuild = true

# ── Linting / typing ──────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # Standard + Import-Sortierung

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true   # linuxcnc hat keine Stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
