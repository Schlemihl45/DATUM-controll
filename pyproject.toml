# ── Build system ──────────────────────────────────────────────────────────────
# scikit-build-core handles both the CMake C++ extension (voxel_mod) and the
# Python src-layout package in one `pip install -e .` step.
#
# cmake and ninja are pip-installable — no separate system install needed.
# nanobind is required by the C++ extension's CMakeLists.txt.
# If OpenVDB is not found on the system, cmake.optional = true lets
# scikit-build-core skip the extension and still install the Python package.
[build-system]
requires = [
    "scikit-build-core>=0.9",
    "nanobind>=2.0",
    "cmake>=3.18",
    "ninja",
]
build-backend = "scikit_build_core.build"

# ── Project metadata ──────────────────────────────────────────────────────────
[project]
name = "cnc-controller"
version = "0.1.0"
description = "Custom LinuxCNC Control Software"
requires-python = ">=3.11"

dependencies = [
    "pyside6>=6.7.0",
    "moderngl>=5.10.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[project.scripts]
datum-control = "controller.main:main"

# ── scikit-build-core ─────────────────────────────────────────────────────────
[tool.scikit-build]
# src-layout: Python package lives in src/controller/
wheel.packages = ["src/controller"]

# Release build for the C++ extension
cmake.build-type = "Release"

# If OpenVDB is not installed, the root CMakeLists.txt skips the extension
# (find_package(OpenVDB QUIET) + conditional add_subdirectory).
# cmake.optional = true means: if cmake itself fails for any reason,
# scikit-build-core still completes the Python-only install without error.
cmake.optional = true

# ── Linting / typing ──────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
